[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qi-a2a"
version = "0.1.0"
description = "qi 的 A2A 扩展:两层 a2a.json 声明表 + 一个 a2a 代理工具 + 可选直连工具"
readme = "README.md"
requires-python = ">=3.12"
# 宿主 qi-agent 由 qi 自己装着,不写进 dependencies(会让 pip 把宿主降级)。
# 协议全部交给官方 SDK —— 方法名 / A2A-Version 头 / proto oneof / tenant 装饰器
# 都由它处理,自己写一遍等于跟着 SDK 版本表抄一遍。版本与 Hikqin 对齐。
dependencies = ["a2a-sdk>=1.1.2,<2", "httpx>=0.27"]

[project.entry-points."qi.extensions"]
a2a = "qi_a2a:register"

[tool.hatch.build.targets.wheel]
packages = ["qi_a2a"]
