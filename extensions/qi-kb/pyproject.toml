[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qi-kb"
version = "0.4.0"
description = "qi 的知识库扩展：把 hikqin 知识库变成 provider/model 式的工具"
readme = "README.md"
requires-python = ">=3.12"
# 宿主 qi-agent 由 qi 自己装着，不写进 dependencies（写进去会让 pip 把宿主降级，
# 见 docs/extensions.md §10）。http 是本扩展自己的依赖。
dependencies = ["httpx>=0.27"]

[project.entry-points."qi.extensions"]
kb = "qi_kb:register"

[tool.qi]
# 独立发布时声明兼容的 qi-coding-agent 范围;内置 bundle 阶段由 qi-lab 统一校验。
host = ">=0.4,<0.5"
bundle = "qi-lab"

[tool.hatch.build.targets.wheel]
packages = ["qi_kb"]
