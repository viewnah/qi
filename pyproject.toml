[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qi-coding-agent"
version = "0.1.1"
description = "编码 agent 框架:单 agent core + 扩展(MCP / 多 agent / web)"
keywords = ["agent", "coding-agent", "cli", "tui", "llm", "mcp"]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.10",
    "typer>=0.12",
    "rich>=13.0",
    "textual>=0.80",
    "PyYAML>=6.0",
    "litellm>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/viewnah/qi"
Repository = "https://github.com/viewnah/qi"
Issues = "https://github.com/viewnah/qi/issues"
Documentation = "https://github.com/viewnah/qi/tree/dev/docs"

[project.scripts]
qi = "qi_agent.cli:main"

[project.entry-points."qi.extensions"]

[tool.hatch.build.targets.wheel]
packages = ["src/qi_agent"]

[tool.hatch.build.targets.wheel.force-include]
# 手册跟包一起走:提示词里要报出**实际**路径(`paths.docs_dir()`),模型才能自己读。
# 只打 `docs/`;`design/` 是写给改动者的,不进 wheel、不注入提示词。
"docs" = "qi_agent/docs"
# 移植自 pi 的素材(themes / 压缩提示词)要随包带上它们的 MIT 声明 —— 这是 MIT 的要求,
# 只放在仓库根目录对**装包的用户**不算"随附"。
"THIRD_PARTY_NOTICES.md" = "qi_agent/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
markers = [
    "real_extensions: 本测试要装载**本机真装的扩展**(退出默认的 entry-point stub)",
]
asyncio_mode = "auto"
testpaths = ["tests"]
