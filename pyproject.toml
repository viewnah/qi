[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qi-agent"
version = "0.1.0"
description = "编码 agent 框架:单 agent core + 扩展(MCP / 多 agent / web)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.10",
    "typer>=0.12",
    "rich>=13.0",
    "textual>=0.80",
    "PyYAML>=6.0",
    "litellm>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
qi = "qi_agent.cli:main"

[project.entry-points."qi.extensions"]

[tool.hatch.build.targets.wheel]
packages = ["src/qi_agent"]

[tool.hatch.build.targets.wheel.force-include]
# 手册跟包一起走:提示词里要报出**实际**路径(`paths.docs_dir()`),模型才能自己读。
# 只打 `docs/`;`design/` 是写给改动者的,不进 wheel、不注入提示词。
"docs" = "qi_agent/docs"

[tool.pytest.ini_options]
markers = [
    "real_extensions: 本测试要装载**本机真装的扩展**(退出默认的 entry-point stub)",
]
asyncio_mode = "auto"
testpaths = ["tests"]
