# 路由回归集(输入 → 期望 agent)
# 用途:评估 Dispatcher 分派准确率
# 说明:每轮输入独立路由,不做会话亲和。带 `active` 的用例 = 在该 active_agent 的
#      上下文下重跑,期望值可以是**改派**(新任务)也可以是沿用(追问,由 Router 判定)。
- input: "帮我分析这个仓库的代码结构"
  expect: code-analyst
- input: "帮我找一下这段报错可能的原因"
  expect: code-analyst
- input: "写一份项目周报"
  expect: writer
- input: "把这段说明润色一下"
  expect: writer
- input: "随便聊聊今天的天气"      # 无专职命中 → general
  expect: general
- input: "继续"                    # 追问:带 active_agent 上下文重新路由
  active: writer
  expect: writer
- input: "换成帮我分析这个 bug"     # 新任务:应改派
  active: writer
  expect: code-analyst
- input: "@writer 写个 README"     # @ 点名直派
  expect: writer
